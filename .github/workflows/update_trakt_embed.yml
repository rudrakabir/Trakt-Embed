name: Update Trakt Embed HTML

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-trakt-embed
  cancel-in-progress: false

jobs:
  update_html:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Test generator
        run: python -m unittest discover -s tests -v
      - name: Read public profile and generate widget
        env:
          TRAKT_USERNAME: ${{ vars.TRAKT_USERNAME || github.repository_owner }}
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
        run: python public_history.py
      - name: Publish changed history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trakt_embed.html trakt_data.json
          if ! git diff --staged --quiet; then
            git commit -m "Update recent watch history"
            git push
          fi
