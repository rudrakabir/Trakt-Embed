name: Check public Trakt profile
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Read rendered public profile without credentials
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto('https://app.trakt.tv/profile/rudrakabir', wait_until='domcontentloaded', timeout=60000)
              try:
                  page.get_by_text('Malcolm in the Middle', exact=False).first.wait_for(timeout=30000)
              except Exception:
                  pass
              text = page.locator('body').inner_text()
              print('PUBLIC_HISTORY_PRESENT:', 'Malcolm in the Middle' in text)
              print(page.locator('time').evaluate_all('(nodes) => nodes.slice(0,6).map(n => n.parentElement.outerHTML)'))
              print(page.locator('a[href*="/shows/"], a[href*="/movies/"]').evaluate_all('(nodes) => nodes.slice(0,8).map(n => n.parentElement.outerHTML)'))
              page.goto('https://app.trakt.tv/profile/rudrakabir?mode=movie', wait_until='networkidle', timeout=60000)
              print('MOVIE_VIEW:', page.locator('body').inner_text()[:10000])
              print(page.locator('time').evaluate_all('(nodes) => nodes.slice(0,3).map(n => n.parentElement.outerHTML)'))
              print(page.locator('a[href*="/movies/"]').evaluate_all('(nodes) => nodes.slice(0,4).map(n => n.parentElement.outerHTML)'))
              browser.close()
          PY
